packages:
  - "src/lambdas/apim-access-token-refresher"
  - "src/lambdas/apim-key-generator"
  - "src/utils"
  - "tools/check-overrides"
  - "infrastructure/terraform/modules/eventpub/lambda/eventpub"

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
  vue-demi: false
blockExoticSubdeps: true

catalogs:
  build:
    turbo: "^2.10.13"
  lint:
    "@eslint/js": "^9.39.4"
    "@stylistic/eslint-plugin": "^3.1.0"
    "@stylistic/eslint-plugin-ts": "^4.4.1"
    "@typescript-eslint/eslint-plugin": "^8.70.0"
    "@typescript-eslint/parser": "^8.70.0"
    eslint: "^9.37.0"
    eslint-config-airbnb-extended: "^2.3.2"
    eslint-config-next: "^15.3.2"
    eslint-config-prettier: "^10.1.8"
    eslint-import-resolver-typescript: "^4.4.2"
    eslint-plugin-html: "^8.2.0"
    eslint-plugin-import-x: "^4.13.3"
    eslint-plugin-jest: "^29.16.6"
    eslint-plugin-json: "^4.0.1"
    eslint-plugin-jsx-a11y: "^6.10.2"
    eslint-plugin-no-relative-import-paths: "^1.7.3"
    eslint-plugin-prettier: "^5.5.4"
    eslint-plugin-react: "^7.37.5"
    eslint-plugin-security: "^3.0.1"
    eslint-plugin-sonarjs: "^3.0.5"
    eslint-plugin-sort-destructure-keys: "^2.0.0"
    eslint-plugin-unicorn: "^61.0.2"
    typescript-eslint: "^8.70.0"
  test:
    "@types/jest": "^29.5.0"
    "@types/mock-fs": "^4.13.4"
    jest: "^29.0.0"
    jest-environment-jsdom: "^29.0.0"
    jest-html-reporter: "^4.4.2"
    jest-mock-extended: "^4.0.0"
    lcov-result-merger: "^5.0.1"
    mock-fs: "^5.5.0"
    ts-jest: "^29.4.11"
  tools:
    "@tsconfig/node22": "^22.0.6"
    "@types/aws-lambda": "^8.10.163"
    "@types/node": "^24.12.0"
    cross-env: "^10.1.0"
    esbuild: "^0.28.2"
    rimraf: "^6.1.3"
    ts-node: "^10.9.2"
    tsx: "^4.23.13"
    typescript: "^5.9.3"

engineStrict: true
minimumReleaseAge: 2880
nodeOptions: "${NODE_OPTIONS:- } --experimental-vm-modules"

overrides:
  esbuild@>=0.27.3 <0.28.1: '>=0.28.1'
  minimatch@>=10.0.0 <10.2.3: '>=10.2.3'
  yaml@>=2.0.0 <2.8.3: '>=2.8.3'
  js-yaml@>=3.0.0 <3.15.2: '>=3.15.2'
  js-yaml@>=4.0.0 <4.3.2: '>=4.3.2'
resolutionMode: time-based
trustPolicy: no-downgrade
trustPolicyExclude:
  - "semver@6.3.1"
