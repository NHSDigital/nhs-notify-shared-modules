packages:
  - "src/lambdas/apim-access-token-refresher"
  - "src/lambdas/apim-key-generator"
  - "src/utils"
  - "tools/check-overrides"
  - "infrastructure/terraform/modules/eventpub/lambda/eventpub"

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
  vue-demi: false
blockExoticSubdeps: true

catalogs:
  build:
    turbo: "^2.9.6"
  lint:
    "@eslint/js": "^10.0.1"
    "@stylistic/eslint-plugin": "^5.10.0"
    "@stylistic/eslint-plugin-ts": "^4.4.1"
    "@typescript-eslint/eslint-plugin": "^8.46.1"
    "@typescript-eslint/parser": "^8.46.1"
    eslint: "^10.9.1"
    eslint-config-airbnb-extended: "^3.2.0"
    eslint-config-next: "^16.3.4"
    eslint-config-prettier: "^10.1.8"
    eslint-import-resolver-typescript: "^4.4.2"
    eslint-plugin-html: "^8.1.3"
    eslint-plugin-import-x: "^4.13.3"
    eslint-plugin-jest: "^29.0.1"
    eslint-plugin-json: "^5.0.0"
    eslint-plugin-jsx-a11y: "^6.10.2"
    eslint-plugin-no-relative-import-paths: "^1.6.1"
    eslint-plugin-prettier: "^5.5.4"
    eslint-plugin-react: "^7.37.5"
    eslint-plugin-security: "^4.0.1"
    eslint-plugin-sonarjs: "^4.2.0"
    eslint-plugin-sort-destructure-keys: "^3.0.0"
    eslint-plugin-unicorn: "^74.0.0"
    typescript-eslint: "^8.46.1"
  test:
    "@types/jest": "^30.0.0"
    "@types/mock-fs": "^4.13.4"
    jest: "^30.5.1"
    jest-environment-jsdom: "^30.5.1"
    jest-html-reporter: "^4.3.0"
    jest-mock-extended: "^4.0.0"
    lcov-result-merger: "^6.0.0"
    mock-fs: "^5.5.0"
    ts-jest: "^29.4.11"
  tools:
    "@tsconfig/node22": "^22.0.5"
    "@types/aws-lambda": "^8.10.161"
    "@types/node": "^26.4.1"
    cross-env: "^10.1.0"
    esbuild: "^0.25.11"
    rimraf: "^6.1.3"
    ts-node: "^10.9.2"
    tsx: "^4.20.6"
    typescript: "^7.0.2"

engineStrict: true
minimumReleaseAge: 2880
nodeOptions: "${NODE_OPTIONS:- } --experimental-vm-modules"

overrides:
  esbuild@>=0.27.3 <0.28.1: '>=0.28.1'
  minimatch@>=10.0.0 <10.2.3: '>=10.2.3'
  yaml@>=2.0.0 <2.8.3: '>=2.8.3'
resolutionMode: time-based
trustPolicy: no-downgrade
trustPolicyExclude:
  - "semver@6.3.1"
