name: 'Node install and setup'
description: 'Setup node with pnpm and authenticate github package repository'

inputs:
  node-version:
    description: 'Node.js version override for legacy consumers'
    required: false
    default: ''
  pnpm-version:
    description: 'pnpm version override for legacy consumers'
    required: false
    default: ''
  GITHUB_TOKEN:
    description: "Token for access to github package registry"
    required: true

runs:
  using: 'composite'
  steps:
    - name: 'Setup mise when the consumer has a mise config'
      if: hashFiles('mise.toml', '.mise.toml') != ''
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install: false
        cache: true

    - name: 'Resolve tool versions'
      id: versions
      shell: bash
      env:
        INPUT_NODE_VERSION: ${{ inputs.node-version }}
        INPUT_PNPM_VERSION: ${{ inputs.pnpm-version }}
      run: |
        mise_config=""
        if [[ -f mise.toml ]]; then
          mise_config="mise.toml"
        elif [[ -f .mise.toml ]]; then
          mise_config=".mise.toml"
        fi

        node_version="${INPUT_NODE_VERSION}"
        pnpm_version="${INPUT_PNPM_VERSION}"
        if [[ -n "$mise_config" ]]; then
          node_version=$(mise config get tools.node --file "$mise_config")
          pnpm_version=$(mise config get tools.pnpm --file "$mise_config")
          echo "mise-config-exists=true" >> "$GITHUB_OUTPUT"
        else
          if [[ -f .tool-versions ]]; then
            node_version="${node_version:-$(awk '$1 == "nodejs" { print $2; exit }' .tool-versions)}"
            pnpm_version="${pnpm_version:-$(awk '$1 == "pnpm" { print $2; exit }' .tool-versions)}"
          fi
          echo "mise-config-exists=false" >> "$GITHUB_OUTPUT"
        fi

        if [[ -z "$node_version" || -z "$pnpm_version" ]]; then
          echo "Node.js and pnpm versions must be provided by mise.toml or legacy inputs/.tool-versions." >&2
          exit 1
        fi
        echo "node-version=$node_version" >> "$GITHUB_OUTPUT"
        echo "pnpm-version=$pnpm_version" >> "$GITHUB_OUTPUT"

    - name: 'Install locked Node.js and pnpm'
      if: steps.versions.outputs.mise-config-exists == 'true'
      shell: bash
      env:
        MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES: none
      run: MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES=none mise --locked install node pnpm

    - name: 'Setup pnpm'
      if: steps.versions.outputs.mise-config-exists != 'true'
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      with:
        version: '${{ steps.versions.outputs.pnpm-version }}'

    - name: 'Use Node.js'
      if: steps.versions.outputs.mise-config-exists != 'true'
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
      with:
        node-version: '${{ steps.versions.outputs.node-version }}'
        cache: 'pnpm'

    - name: "Configure pnpm for GitHub Packages"
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
      run: |
        scripts/set-github-token.sh
