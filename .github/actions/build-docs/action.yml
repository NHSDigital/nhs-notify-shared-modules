name: "Build Docs"
description: "build jekyll docs"
inputs:
  version:
    description: "Version number"
    required: true
  node_version:
    description: "Node.js version override for legacy consumers"
    required: false
    default: ""
  pnpm_version:
    description: "pnpm version override for legacy consumers"
    required: false
    default: ""
  pnpm_filters:
    description: "Additional pnpm workspace filters passed to pnpm install"
    required: false
    default: ""
  python_version:
    description: "Python version"
    required: false
    default: ""
  poetry_version:
    description: "Poetry version"
    required: false
    default: ""
  GITHUB_TOKEN:
    description: "Token for access to github package registry"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Setup mise for migrated consumers
      if: hashFiles('mise.toml', '.mise.toml') != ''
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install: false
        cache: true
    - name: Resolve Node.js and pnpm versions
      id: versions
      shell: bash
      env:
        INPUT_NODE_VERSION: ${{ inputs.node_version }}
        INPUT_PNPM_VERSION: ${{ inputs.pnpm_version }}
      run: |
        mise_config=""
        if [[ -f mise.toml ]]; then
          mise_config="mise.toml"
        elif [[ -f .mise.toml ]]; then
          mise_config=".mise.toml"
        fi
        node_version="${INPUT_NODE_VERSION}"
        pnpm_version="${INPUT_PNPM_VERSION}"
        if [[ -n "$mise_config" ]]; then
          node_version=$(mise config get tools.node --file "$mise_config")
          pnpm_version=$(mise config get tools.pnpm --file "$mise_config")
          echo "mise-config-exists=true" >> "$GITHUB_OUTPUT"
        else
          if [[ -f .tool-versions ]]; then
            node_version="${node_version:-$(awk '$1 == "nodejs" { print $2; exit }' .tool-versions)}"
            pnpm_version="${pnpm_version:-$(awk '$1 == "pnpm" { print $2; exit }' .tool-versions)}"
          fi
          node_version="${node_version:-22}"
          pnpm_version="${pnpm_version:-11.15.1}"
          echo "mise-config-exists=false" >> "$GITHUB_OUTPUT"
        fi
        echo "node-version=$node_version" >> "$GITHUB_OUTPUT"
        echo "pnpm-version=$pnpm_version" >> "$GITHUB_OUTPUT"
    - name: Install locked Node.js and pnpm
      if: steps.versions.outputs.mise-config-exists == 'true'
      shell: bash
      env:
        MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES: none
      run: MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES=none mise --locked install node pnpm
    - name: Install pnpm
      if: steps.versions.outputs.mise-config-exists != 'true'
      uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      with:
        version: ${{ steps.versions.outputs.pnpm-version }}
        run_install: false
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      if: steps.versions.outputs.mise-config-exists != 'true'
      with:
        node-version: ${{ steps.versions.outputs.node-version }}
    - name: "Configure pnpm for GitHub Packages"
      if: ${{ inputs.GITHUB_TOKEN != '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
      run: |
        scripts/set-github-token.sh
    - name: Install pnpm dependencies
      run: pnpm install --frozen-lockfile --filter ./docs ${{ inputs.pnpm_filters }}
      shell: bash
    - name: Setup Ruby
      uses: ruby/setup-ruby@7372622e62b60b3cb750dcd2b9e32c247ffec26a # v1.302.0
      with:
        ruby-version: "3.2" # Not needed with a .ruby-version file
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
        cache-version: 0 # Increment this number if you need to re-download cached gems
        working-directory: "./docs"
    - name: "Setup Python"
      if: ${{ inputs.python_version != '' }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: "${{ inputs.python_version }}"
        cache: "pip"
        cache-dependency-path: "**/poetry.lock"
    - name: "Install Poetry"
      if: ${{ inputs.poetry_version != '' }}
      shell: bash
      run: pipx install "poetry==${{ inputs.poetry_version }}"
    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
    - name: Build with Jekyll
      working-directory: ./docs
      # Outputs to the './_site' directory by default
      shell: bash
      run: make build BASE_URL="${{ steps.pages.outputs.base_path }}" VERSION="${{ inputs.version }}"
      #run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      env:
        JEKYLL_ENV: production
    - name: Upload artifact
      # Automatically uploads an artifact from the './_site' directory by default
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: "docs/_site/"
        name: jekyll-docs-${{ inputs.version }}
