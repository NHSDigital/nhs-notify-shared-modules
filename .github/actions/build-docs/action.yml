name: "Build Docs"
description: "build jekyll docs"
inputs:
  version:
    description: "Version number"
    required: true
  node_version:
    description: "Node.js version"
    required: false
    default: "22"
  pnpm_version:
    description: "pnpm version to install"
    required: false
    default: "11.15.1"
  pnpm_filters:
    description: "Additional pnpm workspace filters passed to pnpm install"
    required: false
    default: ""
  python_version:
    description: "Python version"
    required: false
    default: ""
  poetry_version:
    description: "Poetry version"
    required: false
    default: ""
  GITHUB_TOKEN:
    description: "Token for access to github package registry"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
    - name: Install pnpm
      uses: pnpm/action-setup@v6.0.8
      with:
        version: ${{ inputs.pnpm_version }}
        run_install: false
    - uses: actions/setup-node@v6.4.0
      with:
        node-version: ${{ inputs.node_version }}
    - name: "Configure pnpm for GitHub Packages"
      if: ${{ inputs.GITHUB_TOKEN != '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
      run: |
        scripts/set-github-token.sh
    - name: Install pnpm dependencies
      run: pnpm install --frozen-lockfile --filter ./docs ${{ inputs.pnpm_filters }}
      shell: bash
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1.302.0
      with:
        ruby-version: "3.3" # Not needed with a .ruby-version file
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
        cache-version: 0 # Increment this number if you need to re-download cached gems
        working-directory: "./docs"
    - name: "Setup Python"
      if: ${{ inputs.python_version != '' }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: "${{ inputs.python_version }}"
        cache: "pip"
        cache-dependency-path: "**/poetry.lock"
    - name: "Install Poetry"
      if: ${{ inputs.poetry_version != '' }}
      shell: bash
      run: pipx install "poetry==${{ inputs.poetry_version }}"
    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v6.0.0
    - name: Build with Jekyll
      working-directory: ./docs
      # Outputs to the './_site' directory by default
      shell: bash
      run: make build BASE_URL="${{ steps.pages.outputs.base_path }}" VERSION="${{ inputs.version }}"
      #run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      env:
        JEKYLL_ENV: production
    - name: Upload artifact
      # Automatically uploads an artifact from the './_site' directory by default
      uses: actions/upload-pages-artifact@v5.0.0
      with:
        path: "docs/_site/"
        name: jekyll-docs-${{ inputs.version }}
