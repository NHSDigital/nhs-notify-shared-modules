name: "Lint Terraform"
description: "Lint Terraform"
inputs:
  root-modules:
    description: "Comma separated list of root module directories to validate, content of the 'infrastructure/environments' is checked by default"
    required: false
runs:
  using: "composite"
  steps:
    - name: "Install Terraform binary"
      shell: bash
      run: |
        MISE_LOCKED=1 mise install terraform
    - name: "Check Terraform format"
      shell: bash
      run: |
        check_only=true ${{ github.action_path }}/check-terraform-format.sh
    - name: "Validate Terraform"
      shell: bash
      run: |
        make terraform-validate-all
