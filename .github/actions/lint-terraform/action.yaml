name: "Lint Terraform"
description: "Lint Terraform"
inputs:
  root-modules:
    description: "Comma separated list of root module directories to validate, content of the 'infrastructure/environments' is checked by default"
    required: false
runs:
  using: "composite"
  steps:
    - name: "Install Terraform binary"
      shell: bash
      run: |
        if command -v mise >/dev/null 2>&1 && [[ -f mise.toml ]]; then
          MISE_LOCKED=1 mise install terraform
        elif command -v asdf >/dev/null 2>&1; then
          if ! asdf plugin list | grep -qx terraform; then
            asdf plugin add terraform
          fi
          asdf install terraform
        elif ! command -v terraform >/dev/null 2>&1; then
          echo "Terraform is unavailable: configure mise or asdf, or provide terraform on PATH." >&2
          exit 1
        fi
        command -v terraform >/dev/null 2>&1 || {
          echo "Terraform installation failed; terraform is not on PATH." >&2
          exit 1
        }
    - name: "Check Terraform format"
      shell: bash
      run: |
        check_only=true ${{ github.action_path }}/check-terraform-format.sh
    - name: "Validate Terraform"
      shell: bash
      run: |
        make terraform-validate-all
