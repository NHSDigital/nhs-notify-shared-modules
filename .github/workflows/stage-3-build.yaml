name: "Build stage"

on:
  workflow_call:
    inputs:
      build_datetime:
        description: "Build datetime, set by the CI/CD pipeline workflow"
        required: true
        type: string
      build_timestamp:
        description: "Build timestamp, set by the CI/CD pipeline workflow"
        required: true
        type: string
      build_epoch:
        description: "Build epoch, set by the CI/CD pipeline workflow"
        required: true
        type: string
      version:
        description: "Version of the software, set by the CI/CD pipeline workflow"
        required: true
        type: string

jobs:
  artefact-jekyll-docs:
    name: "Build Docs"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Setup mise"
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
          cache: true
      - name: "Resolve Node.js and pnpm versions"
        id: tool-versions
        shell: bash
        run: |
          echo "node=$(mise config get tools.node --file mise.toml)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(mise config get tools.pnpm --file mise.toml)" >> "$GITHUB_OUTPUT"
      - name: "Build docs"
        uses: ./.github/actions/build-docs
        with:
          version: "${{ inputs.version }}"
          node_version: "${{ steps.tool-versions.outputs.node }}"
          pnpm_version: "${{ steps.tool-versions.outputs.pnpm }}"

  artefact-1:
    name: "Artefact 1"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Build artefact 1"
        run: |
          echo "Building artefact 1 ..."
      - name: "Check artefact 1"
        run: |
          echo "Checking artefact 1 ..."
      - name: "Upload artefact 1"
        run: |
          echo "Uploading artefact 1 ..."
          # Use either action/cache or action/upload-artifact
  artefact-n:
    name: "Artefact n"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Build artefact n"
        run: |
          echo "Building artefact n ..."
      - name: "Check artefact n"
        run: |
          echo "Checking artefact n ..."
      - name: "Upload artefact n"
        run: |
          echo "Uploading artefact n ..."
